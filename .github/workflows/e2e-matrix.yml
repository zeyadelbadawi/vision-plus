# Full browser matrix (MASTER_PROJECT_PLAN §40: "Chromium on every PR; the full matrix nightly and
# pre-release"). Chromium desktop/mobile + Firefox desktop + WebKit desktop and iPhone viewport.
name: E2E matrix

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTENT_MODE: preview
  NEXT_TELEMETRY_DISABLED: 1
  PW_ALL_BROWSERS: '1'

jobs:
  e2e:
    name: Playwright (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-matrix-traces
          path: test-results/
          retention-days: 7
