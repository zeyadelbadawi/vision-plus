# Preview deployment (MASTER_PROJECT_PLAN §42): every branch / PR gets its own URL on the
# PREVIEW worker (`vision-plus-web-preview`, noindex):
#   https://<branch-alias>-vision-plus-web-preview.<account-subdomain>.workers.dev
#
# Blocked until the client's Cloudflare account exists (D-22). Until the two repository secrets
# below are set, the job is skipped with a notice instead of failing. See docs/DEPLOYMENT.md.
name: Deploy preview

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Upload preview version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork PRs never receive secrets; a push to the same branch already deploys it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CONTENT_MODE: preview
      NEXT_TELEMETRY_DISABLED: 1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Preview deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set (client Cloudflare account pending, D-22). See docs/DEPLOYMENT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm build
      - if: steps.creds.outputs.ready == 'true'
        name: Upload preview version (wrangler versions upload --preview-alias)
        run: pnpm deploy:preview
